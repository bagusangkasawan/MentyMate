<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="theme-color" content="#205781" />

    <title>MentyMate | Preventive Mental Wellbeing & Safer Support</title>
    <meta
      name="description"
      content="MentyMate is a bilingual (English & Bahasa Indonesia) preventive mental wellbeing platform featuring validated PHQ-9 & GAD-7 self-assessments, stepped local care navigation, human-led crisis guidance, and privacy-first controls."
    />
    <meta
      name="keywords"
      content="preventive mental wellbeing, PHQ-9, GAD-7, mental health support Indonesia, bilingual mental health platform, crisis guidance, MentyMate"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="MentyMate: Earlier Awareness, Safer Support" />
    <meta
      property="og:description"
      content="Bilingual preventive mental wellbeing platform with validated screening, stepped local support, and safety-first human referral."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MentyMate | Preventive Mental Wellbeing" />
    <meta
      name="twitter:description"
      content="Earlier Awareness. Safer Support. Validated PHQ-9/GAD-7 screening, local support navigation, and privacy-first wellbeing tracking."
    />

    <!-- Typography: Plus Jakarta Sans (Display) + Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD Structured Data for Search & AI Citations (GEO) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "MentyMate / MateGroup",
            "url": "https://mentymate.mategroup.id",
            "description": "Preventive mental wellbeing platform built in Indonesia for a global audience."
          },
          {
            "@type": "SoftwareApplication",
            "name": "MentyMate",
            "applicationCategory": "HealthApplication",
            "operatingSystem": "Web, PWA",
            "inLanguage": ["en", "id"],
            "description": "AI-assisted preventive mental wellbeing platform with validated PHQ-9 and GAD-7 self-assessment, local care navigation, and deterministic human-led crisis escalation."
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Does MentyMate provide clinical diagnoses?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. MentyMate provides validated self-assessment tools (PHQ-9 and GAD-7) for early awareness and connects users to local human professionals, without claiming clinical diagnosis."
                }
              },
              {
                "@type": "Question",
                "name": "How does MentyMate handle crisis situations?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "MentyMate uses deterministic safety detection and pre-reviewed crisis templates in English and Bahasa Indonesia to immediately surface local emergency numbers, crisis helplines, and trusted-contact options."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
